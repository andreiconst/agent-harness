[project]
name = "agent-harness"
version = "0.1.0"
description = "A from-scratch coding agent, built to chase a good SWE-bench score."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "datasets>=2.19",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Official SWE-bench docker-based evaluation harness.
eval = ["swebench>=2.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
